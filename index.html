<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Name | Contact</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f3f1;
  color:#111;
}

.card{
  width:min(420px,100%);
  padding:34px 24px 24px;
  border-radius:28px;
  background:white;
  box-shadow:0 20px 60px rgba(0,0,0,.10);
  text-align:center;
}

.logo{
  width:72px;
  height:72px;
  margin:auto auto 18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
  font-size:25px;
  font-weight:800;
}

h1{
  margin:0;
  font-size:27px;
}

.sub{
  margin:8px 0 26px;
  color:#777;
}

.links{
  display:grid;
  gap:12px;
}

a{
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #e7e7e7;
  border-radius:16px;
  text-decoration:none;
  color:#111;
  font-weight:650;
}

a:hover{
  background:#f7f7f7;
}

.footer{
  margin-top:22px;
  color:#aaa;
  font-size:11px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">YN</div>

  <h1>Your Name</h1>
  <p class="sub">Get in touch</p>

  <div class="links">

    <a href="https://wa.me/YOURNUMBER">
      WhatsApp
    </a>

    <a href="https://instagram.com/YOURUSERNAME">
      Instagram
    </a>

    <a href="mailto:YOUREMAIL@example.com">
      Email
    </a>

  </div>

  <div class="footer">
    Scan • Connect • Contact
  </div>

</div>

</body>
</html>
